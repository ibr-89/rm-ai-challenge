let state={screen:'home',level:'STANDARD',set:[],i:0,pick:'',revealed:false,answers:[],analyticsCompleted:false};const app=document.querySelector('#app');
function track(name,parameters={}){if(typeof window.gtag==='function')window.gtag('event',name,parameters)}
function choose(level){const pool=B.filter(s=>level==='STANDARD'?s.id<=12:s.id>=13),key=`rm-last-${level}`;let previous=[];try{previous=JSON.parse(localStorage.getItem(key)||'[]')}catch{}const shuffle=a=>[...a].sort(()=>Math.random()-.5),fresh=shuffle(pool.filter(s=>!previous.includes(s.id))),fallback=shuffle(pool.filter(s=>previous.includes(s.id))),ordered=[...fresh,...fallback],set=[];D.forEach(d=>{const match=ordered.find(s=>s.a===d.v&&!set.some(x=>x.id===s.id));if(match)set.push(match)});while(set.length<5){const next=ordered.find(s=>!set.some(x=>x.id===s.id));if(!next)break;set.push(next)}const result=shuffle(set);try{localStorage.setItem(key,JSON.stringify(result.map(s=>s.id)))}catch{}return result}
function start(){state={...state,screen:'game',set:choose(state.level),i:0,pick:'',revealed:false,answers:[],analyticsCompleted:false};track('challenge_started',{difficulty:state.level.toLowerCase()});render()}
function answer(){if(!state.pick)return;const s=state.set[state.i];state.revealed=true;state.answers.push(state.pick===s.a);render()}
function selectChoice(value){state.pick=value;document.querySelectorAll('[data-choice]').forEach(button=>button.classList.toggle('selected',button.dataset.choice===value));const lock=document.querySelector('#lock');if(lock)lock.disabled=false}
function next(){state.i++;state.pick='';state.revealed=false;render()}
function result(){state.screen='result';render()}
function replay(){start()}
function home(){state.screen='home';state.answers=[];render()}
function render(){if(state.screen==='home')return homeView();if(state.screen==='result')return resultView();gameView()}
function homeView(){app.innerHTML=`<div class="shell"><section class="panel"><div class="top"><div class="brand"><span class="mark">✈</span> RM DECISION LAB</div><span class="meta">5 scenarios · ~3 minutes</span></div><div class="hero"><span class="eyebrow">✦ INTERACTIVE CHALLENGE</span><h1>Can you beat <em>the AI?</em></h1><p>Step into the revenue manager’s seat. Make five inventory decisions, then compare your judgment with a transparent decision engine.</p><h3 class="level-title">Choose your difficulty</h3><div class="levels"><button class="level ${state.level==='STANDARD'?'active':''}" data-level="STANDARD"><span class="dot"></span><span><strong>Standard</strong><small>Clearer demand signals</small></span></button><button class="level ${state.level==='ADVANCED'?'active':''}" data-level="ADVANCED"><span class="dot"></span><span><strong>Advanced</strong><small>More ambiguous trade-offs</small></span></button></div><div class="actions"><button class="btn" id="start">Start ${state.level.toLowerCase()} challenge →</button><div class="creator"><span class="initials">IA</span><span><small>Created by</small><strong>Ibrahim F. Alhodil</strong></span></div></div></div><div class="footer"><span>Educational simulation · 100% synthetic data</span><span>Five balanced scenarios per attempt</span></div></section></div>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;track('difficulty_selected',{difficulty:state.level.toLowerCase()});document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x.dataset.level===state.level));document.querySelector('#start').textContent=`Start ${state.level.toLowerCase()} challenge →`});document.querySelector('#start').onclick=start}
function gameView(){if(state.i>=5)return result();const s=state.set[state.i];app.innerHTML=`<div class="shell"><div class="game"><div class="top"><div class="brand"><span class="mark">✈</span> RM DECISION LAB</div><div class="meta">Scenario ${state.i+1} of 5 <div class="progress"><i style="width:${(state.i+1)*20}%"></i></div></div></div><div class="grid"><section class="card"><span class="tag">${s.t}</span><div class="route-label">ROUTE</div><h1 class="route">${s.r}</h1><p class="context">${s.c}</p><div class="metrics">${[['Departure',s.d],['Load factor',s.l+'%'],['Seats left',s.s],['Demand',s.m]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="signal"><span>Live market signal</span><strong>${s.g}</strong></div></section><section class="card"><div class="decision-title">YOUR DECISION</div><h2>What would you do?</h2><div class="options">${D.map(d=>`<button class="option ${state.pick===d.v?'selected':''} ${state.revealed&&s.a===d.v?'correct':''}" data-choice="${d.v}" ${state.revealed?'disabled':''}><strong>${d.l}</strong><small>${d.h}</small></button>`).join('')}</div>${state.revealed?`<div class="feedback ${state.pick===s.a?'':'wrong'}"><h3>${state.pick===s.a?'✓ You matched the engine':'× The engine chose differently'}</h3><p>${s.e}</p><div class="chain">${s.x.map(x=>`<span class="chip">${x}</span>`).join('')}</div><button class="btn wide" id="next">${state.i===4?'View my score':'Next scenario'} →</button></div>`:`<button class="btn wide" id="lock" ${!state.pick?'disabled':''}>Lock in decision →</button>`}</section></div><div class="footer"><span>Educational simulation using synthetic data</span><span>No real airline rules or data are used</span></div></div></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>selectChoice(b.dataset.choice));const lock=document.querySelector('#lock');if(lock)lock.onclick=answer;const n=document.querySelector('#next');if(n)n.onclick=state.i===4?result:next}
function resultView(){const correct=state.answers.filter(Boolean).length,score=correct*20,title=score===100?'Exceptional':score>=80?'Revenue Strategist':score>=60?'Sharp Commercial Thinker':'Demand Explorer';if(!state.analyticsCompleted){track('challenge_completed',{difficulty:state.level.toLowerCase(),final_score:correct,score_percent:score});track('final_score',{difficulty:state.level.toLowerCase(),score:correct,score_percent:score});state.analyticsCompleted=true}app.innerHTML=`<div class="shell"><section class="panel result"><div class="trophy">🏆</div><p class="eyebrow">${state.level} CHALLENGE COMPLETE</p><h1 class="score">${score}<span>/100</span></h1><h2>${title}</h2><div class="ticks">${state.answers.map(x=>`<span class="tick ${x?'':'no'}">${x?'✓':'×'}</span>`).join('')}</div><div class="actions center"><button class="btn" id="again">↻ Try another set</button><button class="btn secondary" id="change">Change difficulty</button><button class="btn secondary" id="share">Share my score</button></div><p class="disclaimer">Synthetic scenarios for learning only. This simulation does not represent any airline’s policies, data, or production systems.</p></section></div>`;document.querySelector('#again').onclick=replay;document.querySelector('#change').onclick=home;document.querySelector('#share').onclick=async()=>{const text=`I scored ${score}/100 in Can You Beat the AI? — an airline revenue management challenge.`;if(navigator.share)await navigator.share({title:'Can You Beat the AI?',text,url:location.href});else{await navigator.clipboard.writeText(`${text} ${location.href}`);alert('Score copied!')}}}
render();</script></body></html>
