<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Test your commercial judgment across synthetic airline revenue management scenarios."><title>Can You Beat the AI? | RM Decision Lab</title><style>:root{--bg:#06101b;--panel:#0d1c2c;--panel2:#081420;--cyan:#66e4ee;--text:#f4f8fb;--muted:#8a9bad;--border:rgba(150,190,220,.15);--green:#6ee7b7;--red:#fda4af}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 8%,rgba(31,160,184,.15),transparent 28%),linear-gradient(155deg,#081421,#040a11 72%);color:var(--text);font-family:"Avenir Next","Segoe UI",Arial,sans-serif}.shell{min-height:100vh;padding:28px}.panel{width:min(1120px,100%);margin:auto;border:1px solid var(--border);border-radius:32px;background:linear-gradient(145deg,rgba(15,31,49,.97),rgba(7,16,27,.97));box-shadow:0 30px 90px #0008;padding:42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:750;letter-spacing:.08em}.mark{display:grid;width:42px;height:42px;place-items:center;border-radius:13px;background:var(--cyan);color:#06131b;font-size:20px;transform:rotate(-3deg)}.meta,.footer{font-size:13px;color:var(--muted)}.hero{max-width:760px;margin-top:74px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:750;letter-spacing:.16em}.hero h1{font-size:clamp(50px,8vw,88px);line-height:.94;letter-spacing:-.06em;margin:20px 0 0}.hero h1 em{color:var(--cyan);font-style:normal}.hero>p{max-width:620px;color:#c2ced8;font-size:18px;line-height:1.7}.level-title{margin:26px 0 10px;font-size:14px}.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:600px}.level{cursor:pointer;display:flex;gap:13px;align-items:center;text-align:left;padding:15px;border:1px solid var(--border);border-radius:16px;background:#050e18;color:var(--text)}.level.active{border-color:var(--cyan);background:rgba(102,228,238,.08);box-shadow:inset 3px 0 var(--cyan)}.dot{width:16px;height:16px;border:2px solid #64788b;border-radius:50%}.active .dot{border:5px solid var(--cyan)}.level strong,.level small{display:block}.level small{color:var(--muted);margin-top:3px}.btn{cursor:pointer;border:0;border-radius:999px;padding:15px 23px;background:var(--cyan);color:#06131b;font-weight:750;font-size:15px}.btn:hover{filter:brightness(1.1)}.btn.secondary{background:rgba(255,255,255,.06);border:1px solid var(--border);color:white}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.creator{display:inline-flex;align-items:center;gap:12px;margin:24px 0 0 14px;padding:11px 15px;border:1px solid rgba(102,228,238,.2);border-radius:16px;background:rgba(102,228,238,.07)}.initials{display:grid;width:42px;height:42px;place-items:center;border-radius:12px;background:var(--cyan);color:#07111e;font-weight:850}.creator small,.creator strong{display:block}.creator small{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.footer{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.08);margin-top:42px;padding-top:18px}.game{width:min(1240px,100%);margin:auto}.progress{height:7px;width:150px;border-radius:10px;background:#183047;overflow:hidden}.progress i{display:block;height:100%;background:var(--cyan)}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:20px;margin-top:28px}.card{border:1px solid var(--border);border-radius:28px;background:linear-gradient(145deg,rgba(15,31,49,.96),rgba(8,19,31,.96));padding:34px}.tag{display:inline-block;border:1px solid rgba(102,228,238,.22);background:rgba(102,228,238,.08);color:#8cecf2;border-radius:999px;padding:7px 12px;font-size:12px}.route-label{font-size:12px;color:var(--muted);letter-spacing:.18em;margin-top:38px}.route{font-size:48px;letter-spacing:-.04em;margin:5px 0 18px}.context{font-size:18px;line-height:1.7;color:#c2ced8}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:27px}.metric,.signal{border:1px solid var(--border);background:#050e1880;border-radius:16px;padding:15px}.metric small{color:var(--muted)}.metric strong{display:block;margin-top:5px}.signal{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}.signal span{color:var(--muted)}.signal strong{color:var(--cyan)}.decision-title{color:var(--cyan);font-size:13px;font-weight:700}.card h2{margin:8px 0 20px}.options{display:grid;gap:10px}.option{cursor:pointer;text-align:left;border:1px solid var(--border);background:#050e1855;color:white;border-radius:16px;padding:14px 17px}.option.selected{border-color:var(--cyan);box-shadow:inset 3px 0 var(--cyan);background:rgba(102,228,238,.07)}.option.correct{border-color:#34d399}.option strong,.option small{display:block}.option small{color:var(--muted);margin-top:3px}.wide{width:100%;margin-top:18px;border-radius:12px}.feedback{margin-top:18px;border:1px solid var(--border);border-radius:18px;background:#030a1275;padding:18px}.feedback h3{margin:0;color:var(--green)}.feedback.wrong h3{color:var(--red)}.feedback p{color:#c2ced8;line-height:1.6}.chain{display:flex;flex-wrap:wrap;gap:7px}.chip{border-radius:999px;background:#15283b;padding:7px 10px;font-size:12px;color:#bdc9d4}.result{text-align:center;max-width:740px}.trophy{display:grid;width:80px;height:80px;place-items:center;margin:auto;border-radius:50%;background:var(--cyan);color:#06131b;font-size:34px}.score{font-size:72px;letter-spacing:-.05em;margin:10px 0}.score span{color:#526477}.ticks{display:flex;justify-content:center;gap:8px;margin:24px}.tick{display:grid;width:40px;height:40px;place-items:center;border-radius:50%;background:#15313a;color:var(--green)}.tick.no{background:#351c28;color:var(--red)}.center{justify-content:center}.disclaimer{font-size:12px;color:#56687a;line-height:1.6;margin-top:28px}@media(max-width:850px){.shell{padding:14px}.panel,.card{padding:23px;border-radius:22px}.hero{margin-top:52px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.levels{grid-template-columns:1fr}.creator{margin-left:0}.footer{flex-direction:column;gap:8px}.route{font-size:38px}.meta .progress{display:none}}@media(prefers-reduced-motion:no-preference){.panel,.card{animation:enter .45s ease both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}</style></head><body><main id="app"></main><script>const D=[{v:'OPEN',l:'Open',h:'Release more inventory'},{v:'PROTECT',l:'Protect',h:'Hold for higher value'},{v:'CLOSE',l:'Close',h:'Stop new sales'},{v:'OBSERVE',l:'Observe',h:'Wait for a clearer signal'}];
const B=[
{id:1,r:'JED → LHR',t:'High-demand departure',d:'3 days',l:92,s:21,m:'Rising quickly',c:'Premium demand is accelerating while the remaining inventory is concentrated in lower fare classes.',g:'+18% searches in 24h',a:'PROTECT',e:'With departure close, high load and demand accelerating, protecting remaining inventory preserves the opportunity for late high-value demand.',x:['Demand ↑','Seats ↓','Departure near','Protect value']},
{id:2,r:'RUH → DXB',t:'Soft midweek demand',d:'12 days',l:54,s:73,m:'Below forecast',c:'Booking pace has remained soft for four days and competitors are showing broad availability.',g:'−11% vs. forecast',a:'OPEN',e:'There is enough time and capacity to stimulate demand. Opening inventory supports conversion before the booking window narrows.',x:['Pace ↓','Capacity ↑','Time available','Open demand']},
{id:3,r:'DMM → CAI',t:'Noisy market signal',d:'8 days',l:76,s:42,m:'Volatile',c:'Search traffic spiked after a competitor schedule change, but bookings have not yet followed.',g:'4.2× searches, flat sales',a:'OBSERVE',e:'Searches alone are not demand. The signal is too young to justify a strong inventory move, so monitoring conversion is the balanced decision.',x:['Searches ↑','Sales flat','Signal uncertain','Observe']},
{id:4,r:'JED → IST',t:'Operational disruption',d:'18 hours',l:98,s:5,m:'Very high',c:'A nearby departure was cancelled and reaccommodation pressure is building on this flight.',g:'27 displaced guests',a:'CLOSE',e:'At near-full load with active reaccommodation pressure, closing new sales protects the small operational buffer and reduces oversell risk.',x:['Disruption','Load 98%','Buffer critical','Close sales']},
{id:5,r:'MED → KUL',t:'Connecting opportunity',d:'21 days',l:68,s:61,m:'Healthy',c:'Local demand is steady, while connecting demand produces a stronger total itinerary contribution.',g:'+14% network contribution',a:'PROTECT',e:'Protecting selected inventory for stronger connecting demand can improve total network contribution without closing the flight broadly.',x:['Local steady','Connection strong','Network value ↑','Protect']},
{id:6,r:'RUH → CDG',t:'Late premium pickup',d:'2 days',l:87,s:29,m:'Premium-led',c:'Economy is filling steadily, while premium bookings have accelerated inside the final 72-hour window.',g:'Premium pace +23%',a:'PROTECT',e:'Late premium pickup supports protecting selected inventory rather than releasing it into lower-value demand too early.',x:['Premium pace ↑','Window closing','Value at risk','Protect']},
{id:7,r:'JED → AMM',t:'Capacity opportunity',d:'16 days',l:43,s:96,m:'Soft',c:'The flight has significant unsold capacity and booking pace is trailing the seasonal pattern.',g:'Pace −17%',a:'OPEN',e:'With ample capacity and time remaining, opening inventory can support conversion and rebuild booking pace.',x:['Load low','Pace ↓','Time available','Open']},
{id:8,r:'DMM → BAH',t:'Event demand uncertainty',d:'6 days',l:71,s:38,m:'Unconfirmed',c:'Search activity rose around a possible event, but neither bookings nor competitor pricing show a reliable change yet.',g:'Searches +31%, sales flat',a:'OBSERVE',e:'The event signal has not converted into commercial demand. Waiting for booking or pricing confirmation avoids reacting to noise.',x:['Event signal','Sales flat','No price move','Observe']},
{id:9,r:'RUH → LHR',t:'Oversell risk',d:'9 hours',l:101,s:0,m:'Very high',c:'The flight is already oversold and the expected no-show buffer has narrowed after check-in activity.',g:'Check-in above forecast',a:'CLOSE',e:'With an active oversell and a weakening no-show buffer, further sales would add operational and customer risk.',x:['Oversold','No-shows ↓','Risk ↑','Close']},
{id:10,r:'JED → BKK',t:'Leisure booking window',d:'34 days',l:59,s:78,m:'Stable',c:'Bookings are on plan, but a large share of leisure demand is expected during the next two weeks.',g:'Pace aligned to forecast',a:'OBSERVE',e:'Performance is on plan and the main booking window is still ahead. A strong move now would be premature.',x:['On plan','Window ahead','No pressure','Observe']},
{id:11,r:'MED → DXB',t:'Short-haul demand gap',d:'10 days',l:48,s:81,m:'Weak',c:'Conversion has softened across direct channels while competitor schedules remain unchanged.',g:'Conversion −9%',a:'OPEN',e:'Low load and weakening conversion with no external capacity shock support a controlled opening to stimulate bookings.',x:['Load low','Conversion ↓','Capacity stable','Open']},
{id:12,r:'RUH → JFK',t:'Network contribution',d:'14 days',l:84,s:44,m:'Strong',c:'Local demand remains healthy, but several high-contribution connecting flows are entering their peak booking period.',g:'Connections +19% value',a:'PROTECT',e:'Selective protection preserves access for stronger network flows while avoiding an unnecessary full closure.',x:['Local healthy','Connections ↑','Contribution ↑','Protect']},
{id:13,r:'JED → CAI',t:'Holiday pressure',d:'30 hours',l:97,s:8,m:'Surging',c:'A holiday departure is nearly full and same-day search-to-book conversion is accelerating.',g:'Conversion 2.1× normal',a:'CLOSE',e:'Minimal capacity and accelerating conversion create a high oversell risk. Closing sales protects the final operational buffer.',x:['Holiday peak','Load 97%','Conversion ↑','Close']},
{id:14,r:'DMM → IST',t:'Competitor fare move',d:'19 days',l:62,s:64,m:'Mixed',c:'A competitor reduced fares this morning, but the impact on your booking pace is not yet visible.',g:'Fare gap widened today',a:'OBSERVE',e:'A new competitor move needs time to show an effect. Monitor conversion before changing inventory on an unproven signal.',x:['Fare move','Impact unknown','Time available','Observe']},
{id:15,r:'RUH → MNL',t:'Group release',d:'11 days',l:57,s:85,m:'Recovering',c:'A tentative group block was released, returning substantial capacity while individual booking pace is improving.',g:'32 seats returned',a:'OPEN',e:'The released capacity creates room to reopen inventory and capture recovering individual demand before departure nears.',x:['Capacity returned','Pace improving','Seats available','Open']}
];
let state={screen:'home',level:'STANDARD',set:[],i:0,pick:'',revealed:false,answers:[]};const app=document.querySelector('#app');
function choose(level){const pool=B.filter(s=>level==='STANDARD'?s.id<=8:s.id>=9),pick=a=>a[Math.floor(Math.random()*a.length)],set=D.map(d=>pick(pool.filter(s=>s.a===d.v))),rest=pool.filter(s=>!set.some(x=>x.id===s.id));set.push(pick(rest));return set.sort(()=>Math.random()-.5)}
function start(){state={...state,screen:'game',set:choose(state.level),i:0,pick:'',revealed:false,answers:[]};render()}
function answer(){if(!state.pick)return;const s=state.set[state.i];state.revealed=true;state.answers.push(state.pick===s.a);render()}
function next(){state.i++;state.pick='';state.revealed=false;render()}
function result(){state.screen='result';render()}
function replay(){start()}
function home(){state.screen='home';state.answers=[];render()}
function render(){if(state.screen==='home')return homeView();if(state.screen==='result')return resultView();gameView()}
function homeView(){app.innerHTML=`<div class="shell"><section class="panel"><div class="top"><div class="brand"><span class="mark">✈</span> RM DECISION LAB</div><span class="meta">5 scenarios · ~3 minutes</span></div><div class="hero"><span class="eyebrow">✦ INTERACTIVE CHALLENGE</span><h1>Can you beat<br><em>the AI?</em></h1><p>Step into the revenue manager’s seat. Make five inventory decisions, then compare your judgment with a transparent decision engine.</p><h3 class="level-title">Choose your difficulty</h3><div class="levels"><button class="level ${state.level==='STANDARD'?'active':''}" data-level="STANDARD"><span class="dot"></span><span><strong>Standard</strong><small>Clearer demand signals</small></span></button><button class="level ${state.level==='ADVANCED'?'active':''}" data-level="ADVANCED"><span class="dot"></span><span><strong>Advanced</strong><small>More ambiguous trade-offs</small></span></button></div><div class="actions"><button class="btn" id="start">Start ${state.level.toLowerCase()} challenge →</button><div class="creator"><span class="initials">IA</span><span><small>Created by</small><strong>Ibrahim F. Alhodil</strong></span></div></div></div><div class="footer"><span>Educational simulation · 100% synthetic data</span><span>Five balanced scenarios per attempt</span></div></section></div>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;render()});document.querySelector('#start').onclick=start}
function gameView(){if(state.i>=5)return result();const s=state.set[state.i];app.innerHTML=`<div class="shell"><div class="game"><div class="top"><div class="brand"><span class="mark">✈</span> RM DECISION LAB</div><div class="meta">Scenario ${state.i+1} of 5 <div class="progress"><i style="width:${(state.i+1)*20}%"></i></div></div></div><div class="grid"><section class="card"><span class="tag">${s.t}</span><div class="route-label">ROUTE</div><h1 class="route">${s.r}</h1><p class="context">${s.c}</p><div class="metrics">${[['Departure',s.d],['Load factor',s.l+'%'],['Seats left',s.s],['Demand',s.m]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="signal"><span>Live market signal</span><strong>${s.g}</strong></div></section><section class="card"><div class="decision-title">YOUR DECISION</div><h2>What would you do?</h2><div class="options">${D.map(d=>`<button class="option ${state.pick===d.v?'selected':''} ${state.revealed&&s.a===d.v?'correct':''}" data-choice="${d.v}" ${state.revealed?'disabled':''}><strong>${d.l}</strong><small>${d.h}</small></button>`).join('')}</div>${state.revealed?`<div class="feedback ${state.pick===s.a?'':'wrong'}"><h3>${state.pick===s.a?'✓ You matched the engine':'× The engine chose differently'}</h3><p>${s.e}</p><div class="chain">${s.x.map(x=>`<span class="chip">${x}</span>`).join('')}</div><button class="btn wide" id="next">${state.i===4?'View my score':'Next scenario'} →</button></div>`:`<button class="btn wide" id="lock" ${!state.pick?'disabled':''}>Lock in decision →</button>`}</section></div><div class="footer"><span>Educational simulation using synthetic data</span><span>No real airline rules or data are used</span></div></div></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.pick=b.dataset.choice;render()});const lock=document.querySelector('#lock');if(lock)lock.onclick=answer;const n=document.querySelector('#next');if(n)n.onclick=state.i===4?result:next}
function resultView(){const score=state.answers.filter(Boolean).length*20,title=score===100?'Exceptional':score>=80?'Revenue Strategist':score>=60?'Sharp Commercial Thinker':'Demand Explorer';app.innerHTML=`<div class="shell"><section class="panel result"><div class="trophy">🏆</div><p class="eyebrow">${state.level} CHALLENGE COMPLETE</p><h1 class="score">${score}<span>/100</span></h1><h2>${title}</h2><div class="ticks">${state.answers.map(x=>`<span class="tick ${x?'':'no'}">${x?'✓':'×'}</span>`).join('')}</div><div class="actions center"><button class="btn" id="again">↻ Try another set</button><button class="btn secondary" id="change">Change difficulty</button><button class="btn secondary" id="share">Share my score</button></div><p class="disclaimer">Synthetic scenarios for learning only. This simulation does not represent any airline’s policies, data, or production systems.</p></section></div>`;document.querySelector('#again').onclick=replay;document.querySelector('#change').onclick=home;document.querySelector('#share').onclick=async()=>{const text=`I scored ${score}/100 in Can You Beat the AI? — an airline revenue management challenge.`;if(navigator.share)await navigator.share({title:'Can You Beat the AI?',text,url:location.href});else{await navigator.clipboard.writeText(`${text} ${location.href}`);alert('Score copied!')}}}
render();</script></body></html>
